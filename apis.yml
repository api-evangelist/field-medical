aid: field-medical
name: Field Medical
description: 'Field Medical, Inc. is a Carlsbad, California clinical-stage cardiac
  electrophysiology company founded in 2022 by Dr. Steven Mickelsen to build a second-generation
  pulsed field ablation (PFA) platform. Its FieldForce Ablation System pairs a focal
  catheter design with proprietary FieldBending energy and is positioned as the first
  PFA system purpose-built for ventricular arrhythmia ablation, with atrial fibrillation
  applications in development. The company holds FDA Breakthrough Device Designation
  and a place in the FDA TAP Pilot Program for its VT indication, has published first-in-human
  VCAS data in Circulation, and has raised roughly $75M across Series A and Series
  B. Field Medical is a medical device manufacturer, not a software vendor: it publishes
  no developer portal, no public REST/GraphQL API and no SDKs. Its only machine-readable
  public surface is the llms.txt and anonymous site MCP endpoint that its Wix-hosted
  corporate website serves.'
